<html lang="en">
<meta charset="utf-8" />
<title>Share card: what is a good bounce rate</title>
<style>
  @font-face {
    font-family: "Archivo";
    font-weight: 100 900;
    src: url("../../static/fonts/archivo-latin-wght-normal.woff2") format("woff2-variations");
  }
  :root {
    --paper: #f3f2f2;
    --ink: #201e1d;
    --flag: #ec3013;
    --muted: #605d5d;
    --rule: #9b9797;
    --off: #bab6b6;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", sans-serif;
    padding: 62px 72px 0;
    position: relative;
  }
  .mark { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .mark span, .red { color: var(--flag); }
  h1 {
    margin-top: 52px;
    font-size: 92px;
    font-weight: 800;
    line-height: 0.93;
    letter-spacing: -0.035em;
  }
  .rule {
    position: absolute; left: 72px; right: 72px; top: 459px;
    height: 3px; background: var(--rule);
  }
  .foot {
    position: absolute; left: 72px; right: 72px; top: 500px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .foot p { font-size: 24px; line-height: 1.3; }
  .foot b { font-weight: 800; }
  .bars { width: 512px; }
  .bar { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 700; }
  .bar + .bar { margin-top: 12px; }
  .bar i { display: block; height: 30px; background: var(--off); }
  .bar.ours i { background: var(--flag); }
  .bar .n { color: var(--muted); }
</style>
<body>
  <div class="mark">Feasible<span>.lol</span></div>
  <h1>Same 4,662 visits.<br />Two bounce rates.<br /><span class="red">65% or 49%.</span></h1>
  <div class="rule"></div>
  <div class="foot">
    <p>What's a good bounce rate?<br /><b>Ask who counted it first.</b></p>
    <div class="bars">
      <div class="bar ours"><i style="width: 333px"></i><span class="red">65% our rule</span></div>
      <div class="bar"><i style="width: 251px"></i><span class="n">49% GA4's rule</span></div>
    </div>
  </div>
</body>
