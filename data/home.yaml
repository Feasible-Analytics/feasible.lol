# Three short notes under the dashboard screenshot.
dashboard_notes:
  - title: "It loads"
    body: >-
      A month of top pages loads in about a tenth of a second.

  - title: "No report builder"
    body: >-
      Add the script. Your numbers show up. Nothing to configure.

  - title: "Filter anything"
    body: >-
      Click any row to filter the whole dashboard. Add more filters if you need
      them.

# The numbered argument. Order matters: price, privacy, ownership, honesty,
# weight.
pillars:
  - title: "Unlimited means unlimited"
    body: >-
      Add every site, teammate, goal, funnel, and property you need. We only
      count pageviews and custom events. You get one million a month.

  - title: "No cookies. No banner."
    body: >-
      We set no cookies, store no IP addresses, and never follow people between
      sites. Most sites won't need a consent banner for Feasible.
      <a href="/help/do-i-need-a-cookie-banner/" class="text-flag-700 underline">Read
      why</a>.

  - title: "Your team, your data"
    body: >-
      Give people only the access they need. Share a dashboard publicly or
      behind a password. Export every raw event whenever you want.

  - title: "It tells you when it's broken"
    body: >-
      Every dropped event comes with a reason: bot, datacenter address, shield,
      or blocked hostname. You can see what went missing and why.

  - title: "Built light on purpose"
    body: >-
      One binary. One SQLite file. No cluster or queue. Run it on a $4 server,
      or let us host it for $99 a year. It's
      <a href="/open-source-web-analytics/" class="text-flag-700 underline">open
      source web analytics</a> if you'd rather run it yourself.

# What's in the plan, on the pricing card.
plan:
  - "Unlimited websites"
  - "Unlimited team members"
  - "1,000,000 pageviews and events a month"
  - "Unlimited properties, goals and funnels"
  - "5 years of data retention"
  - "Full API, webhooks and data export"
  - "Email and Slack reports"

# The three objections that stop a signup, answered short.
objections:
  - q: "Will I lose my history?"
    a: >-
      No. Upload your old CSV reports. Their pages, sources, locations, devices,
      and browsers appear beside your new numbers.

  - q: "Is a million really the limit?"
    a: >-
      Yes. Most sites never reach it. If you do, we email you. Nothing switches
      off mid-month.
      <a href="/pricing/#enterprise" class="text-flag-700 underline">Talk to us</a>
      if you need more.

  - q: "What happens if you go away?"
    a: >-
      Take the code and run it yourself. Feasible is open source, and your data
      exports as plain CSV.
