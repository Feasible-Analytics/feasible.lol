#

baseURL = "https://feasible.lol/"
locale = "en-us"
defaultContentLanguage = "en"
title = "Feasible"
enableRobotsTXT = true
enableGitInfo = true

# Hugo lowercases and de-punctuates section titles unless told otherwise. Our
# titles are written by hand in front matter, so leave them alone.
capitalizeListTitles = false

# Trailing-slash-free URLs everywhere, matching how the app serves its routes.
disableKinds = ["taxonomy", "term"]

# A page's "last modified" is the date it actually asserts — the `checked:` on a
# comparison page, the `updated:` on a legal one — falling back to the commit
# that last touched the file. Search engines and readers both key off it.
[frontmatter]
  lastmod = ["lastmod", "checked", "updated", ":git", "date"]

[build]
  # Tailwind v4 tree-shakes against this file. Without it every utility in the
  # framework ships to the browser.
  [build.buildStats]
    enable = true

  # Rebuild the stylesheet whenever the class list or a source file changes.
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = 'css/.*\.css'
    target = 'css'

# hugo_stats.json is written to the project root, which is outside the assets
# filesystem Tailwind can see. Mounting it in lets the cachebuster above watch
# it. Declaring any assets mount replaces Hugo's default one, so the standard
# mount has to be re-added alongside.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"
    disableWatch = true

[minify]
  disableXML = true
  minifyOutput = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Content files carry hand-written HTML for comparison tables and callouts.
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    # Colors are inlined rather than emitted as classes, so there is no second
    # stylesheet to keep in step with the theme. github-dark reads correctly on
    # the dark background .copy pre sets.
    noClasses = true
    style = "github-dark"
    lineNos = false
    tabWidth = 2
    wrapperClass = "highlight"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[outputFormats]
  # The search index the help page filters against.
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
  # /feed.xml rather than Hugo's /index.xml — it's the name readers expect and
  # the one the footer links to.
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "feed"
  # /llms.txt — a map of the site for the crawlers that read it to answer a
  # question rather than to rank it.
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true

[permalinks]
  [permalinks.page]
    blog = "/blog/:slug/"

[sitemap]
  filename = "sitemap.xml"

[taxonomies]
  # Help answers group into categories; nothing else on the site is taxonomised.
  category = "categories"

[imaging]
  quality = 82
  resampleFilter = "Lanczos"

[services]
  [services.rss]
    limit = 20

