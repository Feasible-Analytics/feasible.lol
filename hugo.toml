# ------------------------------------------------------------------
# Params
#
# Prices live here, in one place. The in-app pricing page and Stripe are the
# real source of truth for what a card gets charged; when they change, change
# these too. Nothing on a static site can read live Stripe prices.
# ------------------------------------------------------------------
[params]
  description = "Simple, privacy-friendly website analytics. One page, no cookies, no consent banner. Unlimited sites and users, a million pageviews a month, $99 a year — not $1,390."
  tagline = "Simple, Privacy-Friendly Website Analytics"
  company = "Cloudmanic Labs, LLC"
  founded = 2026
  email = "help@feasible.lol"
  salesEmail = "sales@feasible.lol"
  appURL = "https://app.feasible.lol"
  loginURL = "https://app.feasible.lol/login"
  signupURL = "https://app.feasible.lol/register"
  statusURL = "https://status.feasible.lol"
  # The per-site tracker. The token is not a secret — it is served to every
  # visitor — it just routes events to this site's account.
  trackerURL = "https://app.feasible.lol/js/fs-pty4fgk7fztxzmkr.js"
  githubURL = "https://github.com/Feasible-Analytics/app.feasible.lol"
  twitterURL = "https://x.com/FeasibleLOL"
  githubOrg = "https://github.com/Feasible-Analytics"
  ogImage = "/images/og-default.png"

  [params.pricing]
    monthly = "9.99"
    yearly = "99"
    yearlyMonthlyEquivalent = "8.25"
    trialDays = 30
    pageviews = "1,000,000"
    pageviewsShort = "1M"
    retentionYears = 5

  # A named human on the byline and the founder entity. For a domain with no
  # links yet, this is the cheapest trust signal there is.
  [params.author]
    name = "Spicer Matthews"
    jobTitle = "Founder"
    sameAs = ["https://github.com/cloudmanic"]

  [params.social]
    twitter = "feasiblelol"
    github = "Feasible-Analytics"
